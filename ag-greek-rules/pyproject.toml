[project]
name = "ag-greek-rules"
version = "0.8.1"
description = "Versioned, traceable linguistic heuristics for Ancient Greek analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
ag-greek-rules = "ag_greek_rules.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ag_greek_rules"]

[tool.setuptools.package-data]
ag_greek_rules = ["catalog.json", "headword-mappings.json"]
